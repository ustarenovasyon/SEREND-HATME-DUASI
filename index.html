<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d32"><title>Serhendî Hatme Duası</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e6;color:#20352f;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{padding:26px 18px;text-align:center;background:#123d32;color:#f7f2e6}header .k{font-size:12px;letter-spacing:3px;color:#c5a45d;font-weight:700}header h1{margin:5px 0;font-size:28px}header p{margin:4px 0;font-size:12px;letter-spacing:2px}.wrap{max-width:740px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.progress{height:8px;background:#e9e2d3;border-radius:8px;overflow:hidden}.bar{height:100%;background:#c5a45d;width:0%}.stat{display:flex;justify-content:space-between;font-size:13px;margin:10px 0}.lesson{border:0;background:white;border-radius:14px;width:100%;text-align:left;padding:15px;margin:7px 0;color:#123d32;font-weight:700;font-size:16px}.lesson small{display:block;color:#68776e;font-weight:400;margin-top:5px}.part{padding:12px 10px;border-top:1px solid #eee;display:flex;align-items:center;gap:10px}.part button{border:0;background:#f6f2e8;border-radius:12px;padding:10px;color:#123d32;font-weight:600}.hidden{display:none}.text{font-size:23px;line-height:1.7;text-align:center;white-space:pre-wrap;padding:14px 2px;color:#f7f2e6}.study{background:#123d32;border-radius:22px;padding:20px;color:#f7f2e6}.study h3{color:#c5a45d;text-align:center;font-size:13px;letter-spacing:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px;padding:13px;border-radius:12px;border:0;background:#c5a45d;color:#123d32;font-weight:700}.secondary{background:#fff!important;color:#123d32!important;border:1px solid #d8cfbb!important}button{cursor:pointer}#home,#lessonList,#reader,#progressView{display:none}#home{display:block} </style></head><body><header><div class="k">✦ SERHENDÎ ✦</div><h1>Hatme Duası</h1><p>EZBER VE İLERLEME</p></header><main class="wrap"><section id="home"><div class="card"><div class="stat"><b>EZBER İLERLEMEN</b><b id="percent">0%</b></div><div class="progress"><div class="bar" id="bar"></div></div><p id="doneCount">0 / 30 parça tamamlandı</p></div><div class="actions"><button onclick="showLessons()">Derslere göz at</button><button class="secondary" onclick="continueStudy()">Kaldığım yerden devam</button><button class="secondary" onclick="showProgress()">Ezber ilerlemem</button></div><p style="text-align:center;font-size:12px;opacity:.65">İlerlemen bu cihazda saklanır • Çevrimdışı kullanım desteklenir</p></section>
<section id="lessonList"><div class="card"><button class="secondary" onclick="goHome()">← Ana sayfa</button><h2>Dersler</h2><p>Dilediğin dersi istediğin zaman açabilirsin.</p><div id="lessons"></div></div></section>
<section id="reader"><div class="card"><button class="secondary" onclick="showLessons()">← Derslere dön</button><h2 id="lessonTitle"></h2><div class="study"><h3 id="partTitle"></h3><div class="text" id="partText"></div><div class="actions"><button class="secondary" onclick="toggleText()">Metni gizle / göster</button></div></div><div class="actions"><button class="secondary" onclick="previousPart()">← Önceki</button><button onclick="markDone()">Ezberledim ✓</button><button class="secondary" onclick="nextPart()">Sonraki →</button></div></section>
<section id="progressView"><div class="card"><button class="secondary" onclick="goHome()">← Ana sayfa</button><h2>Ezber ilerlemem</h2><div class="stat"><b>Genel tamamlanma</b><b id="pPercent">0%</b></div><div class="progress"><div class="bar" id="pBar"></div></div><p id="pCount"></p><div id="pLessons"></div></div></section></main>
<script>
const lessons=[{"title":"Besmele, hamd ve salât","parts":[{"number":1,"text":"BİSMİLLAHİRRAHMANİRRAHİM"},{"number":2,"text":"Elhamdü lillâhi rabbil âlemin Elhamdü lillâhi hakka hamdihi ve senâihi vessalâtü vesselâmü alâ hayri halkıhi Muhammedin ve alâ âlihi ve sahbihi ecmain"}]},{"title":"Hatme sevabının hediye edilmesi","parts":[{"number":3,"text":"Allahümme belliğ ve evsıl misle sevâbi hâzihil hatmetiş şerifetil mübâreketi badel Gabüli minnâ bil fadli vel keremi hediyyeten minnâ vâsıleten ilâ ravdati menbaıs sıdkı vessafâ eşrafil verâ Hazreti Seyyidinâ Muhammeden il Mustafa (Sallallahu Aleyhi ve Sellem) (ve ilâ rühi)"},{"number":4,"text":"Küllin min âlihi ve evlâdihi ve ezvâcihi ve ashâbihi ve etbâihi ve zürriyyâtihi ve muhâcirihi ve ensârih (rıdvanullahi teâlâ aleyhim ecmain)"}]},{"title":"Tarikat silsilesine giriş ve Şâh-ı Nakşibend","parts":[{"number":5,"text":"Küllin min sâdâti silsiletit tarikatil aliyyetin Nakşibendiyyeti vel Kâdiriyyeti, ves Sühreverdiyyeti vel Çeştiyyeti vel Kübreviyye"},{"number":6,"text":"Şeyhınâ ve melâzinâ ve kıdvetinâ ve imâminâ ve imâmit tarikati zil feydıl câri vennüris sâri eş şeyh bahâil hakkı vel hakikati veddin hazreti eş şeyh Muhammedinil Üveysiyyil Buhâri el marüfi bi Şâh-ı Nakşibend"},{"number":7,"text":"Menbail meârifi vel kemâli seyyidis sâdâti es Seyyid Emir Külâl"}]},{"title":"Hâcegân büyükleri","parts":[{"number":8,"text":"El Mukbili aleyke ve limâsivâken nâsi eş Şeyh Muhammed Babassemmâsi"},{"number":9,"text":"El vâlihi fi mehabbeti mevlâhül ganiyyi el marüfi bi Hazreti azizân Hoca Aliyyir Râmiteni"},{"number":10,"text":"El Muridi anil murâdid dünyeviyyi vel uhreviyyi Hazreti eş Şeyh Mahmüdinil İnciri Fağnevi"},{"number":11,"text":"El Mütesellihi anil hicâbil beşeriyyi Hazreti eş şeyh Ârifir Rivegeri"}]},{"title":"İmam-ı Rabbânî ve Mevlânâ Hâlid","parts":[{"number":12,"text":"Gutbil evliyei ve burhânil esfiyei kâmiil bidati muhyissünneti şeyhil meşâyihi mevlânâ Hazreti eş Şeyh Abdülhalık Gucdevâni"},{"number":13,"text":"Gutbil haggâni el gavsis samedâni eş Şeyh Ahmed el Fârükıyyis serhendi el marüfi bil İmâmir Rabbâni müceddidil elfisseni"}]},{"title":"Seyyid Abdullah ve Seyyid Tâhâ","parts":[{"number":14,"text":"Gutbi dâiretil irşâdi Gavsis sekaleyni ales sedâdi essâiri fillâhir râkis sâcidi zilcenâheyni Diyeiddin, Mevlânâ Hazreti eş şeyh Hâlid"},{"number":15,"text":"Menbail hılmi ve nüriz zalâm elhâdi beynel aşeiri vel eğvâm sirâciddinillezi zahera min halefi seyyidil enâm mevlânâ Hazreti es Seyyid Abdullah"}]},{"title":"Sıbğatullah Arvasî ve Abdurrahman Tâhî","parts":[{"number":16,"text":"Şeyhınel gayürillezi bihi netebehel veguri gutbil irşâdi vel mederi hazreti şihebiddin mevlana Hazreti eş şeyh es Seyyid Tâhâ"},{"number":17,"text":"Sultânil küberâil mütegaddimin gıdvetil küberâil müteahhirin gavsil âmmeti vel hâifin gutbil eimmeti ves sâlikin muğisil müsteğisin münisil gurabei vel âşıkin şeyhinel kâmilil mükemmilil Üveysiyyi Mevlânâ Hazreti eş şeyh seyyid Sıbğatullahil Arvesi"}]},{"title":"Fethullah ve Muhammed Diyâüddin","parts":[{"number":18,"text":"Sultânil arifin, kutbil aktâbil vâsılin, el müteşerrifi bil fenâil mutlak mürebbis sâlikine ilâ rabbihim alel vechil ehak, nâsıriş şeriatil garrâ kâmiil bid'atid darrâ müceddidi âsâris selefi vet tâbiin ve mümehhidi bünyâni tarikatil halefi vellâhikin el mutasarrifi alel ıtlak ellezi lem yüra lehü nâzirun badet tefehhusı fil âfâk, kâtıın nisbeti anil mübtedittâği mevlânâ şeyhinel kâmilil mükemmili, Hazreti eş şeyh Abdurrahmani Tâhi"},{"number":19,"text":"Şeyhiş şeriati ve şehbâzit tarikati ve burhânil hakikati, elfâni fillâhi ve bâki billâh el mutasımi bi hablillâh şeyhinel kâmili mükemmili, mevlânâ Hazreti eş Şeyh Fethullah"}]},{"title":"Ahmed el-Haznevî","parts":[{"number":20,"text":"Câmii kemâlâtil evliyâil evvelin ve mecmail âdâbi ve füyüdâtil âhirin, umdetil İslâmi vel müslimin, umüdil meşâyihı bi ecmaihim ves sâlikinn nurus semâvâti vel aradin sirâcil milleti ved din, kehfid duafâi vel mesâkin, kutbil eimmeti ves sâlikin sultânil âşıkin şeyhinel kâmilil mükemmili mevlânâ Hazreti eş-Şeyh Muhammed Diyâüddin"}]},{"title":"Abdülhakim el-Hüseynî","parts":[{"number":21,"text":"Vârisi makâmâtil evliyâi vel mürselin, imâmil mü'minin, umdetil âbidine ves sâlikin muzhiriş şeriatil ğarrâi muhyit tarikatin Nakşibendiyyetil beydâ el mütesellihi anil hicâbil insiyyi el hâzini lissırril maneviyyi mevlânâ şeyhinel kâmilil mükemmili Hazreti eş şeyh Ahmed el Haznevi"}]},{"title":"Muhammed Râşid ve Abdülbâkî el-Hüseynî","parts":[{"number":22,"text":"Sultânil câzibin nüri hidâyetil vasılin kutbil ferdi lil âlemin, nâşiril meslekil Ahmediyyeti fer ış şeceretil Muhammediyye pirit tarikatin Nakşibendiyye, sâhibis seciyyetil mahmüdiyye es sâki min hıyâdıl bahâiyye nâsıbil alamid diniyye muhyi âsâri kübbâris selefi vet tâbiin metlail himemi bilyakin menhecis saâdeti lil musaddıkin şeyhinel kâmilil mükemmilil üveysiyyi Bilvânisi Mevlânâ Hazreti eş şeyh es-Seyyid Abdülhakim EL-Hüseyni"},{"number":23,"text":"Sultânil müslimine vel müstecirin ve tâcil mensürin ve muhibbil mahbübin ve müşâril müsteşirin ve irşâdil mürşidin ve Sırris sâdıkine bi hidâyeti rabbil alemin el fâtihi künüzel ilmi veddin el müstakırri biş şeriatil garrai muhyit tarikatin Nakşibendiyyetil beydâ şeyhinel kâmilil mükemmilil Bilvânisi Mevlânâ Hazreti eş şeyh es Seyyid Muhammed Râşid Hüseyni"}]},{"title":"Muhammed Sâkî ve kapanış duaları","parts":[{"number":24,"text":"Mecmai âmâlil müslimin kutbil fâizine sikkatil müttakine vesiletil mütevekkilin sâhibis sehâveti vel kerâmeti lil âlemin kesîril mehabbeti lil mütevâdiin sâhibiş şeriati vet tarikatin Nakşibendiyye şeyhinel kâmili mükemmilil üveysiyyil Bilvânisi, Mevlânâ Hazreti eş şeyh es Seyyid Abdülbaki EL-Hüseyni"},{"number":25,"text":"Sultanin âşikin Kutbil aktabil vasilin El mutemessikil bi şeriati seyyidil mürselin Kesiril mahabbeti lissadikin Melceil ûlemai vel arifin, Cazibi kulübil müslimin, muhyis sünnetin nebeviyyeti muceddidil adabi vet tarikatin Nakşabendiyyetil âliyyeti elmensuri min şemsil medinetil münevvereti Mevlaya ve şeyhi ve seyyidi ve senedi ve men bihi temessuki ve aleyhi itimadi ve bihi iftihari ve minhu istimdadi ve kurrati ayni Şeyhinel kamilil mukemmilil bilvanisi mevlana Hazreti Eş şeyh Seyyid Muhammed Saki El-Hüseyni"},{"number":26,"text":"Küllin mines sâdâti vel hulefâi vel müridine vel muhibbine vel mahbübine vel mensübine vel müntesibine ilâ hâzihittarikatil aliyyeti ve sâirit turuk."},{"number":27,"text":"Allâhümmec al misle sevabihâ mektüben fisahifeti amâli küllin verfa bihâ deracâti küllin ve ali bihâ fi alâ illiyyine menzilete küllin, ve zidnâ bihâ mehabbeten inde cenâbi küllin, ve efid aleynâ min berekâti küllin, ve etmim lenâ sülüke hâzihit tarikatil aliyyeti ve veffiknâ limerdâti şeyhinâ ve imtisâli evâmirihi ve ictinâbi menâhih"},{"number":28,"text":"Allâhümmerzuknel bekâe bike badel fenai fike alâ kademi sâdâtines sâlikine fihâ"},{"number":29,"text":"Allâhümmağfir lenâ, hatâyânâ ve eclibnâ ilâ mehabbetike bi-mehabbeti habibike ve bimehabbeti evliyaike verzuknet tevfika vel istikamete ala dinike ve taatike bi rahmetike Yâ Erhamerrâhimin"},{"number":30,"text":"Âmin, Vel hamdü lillâhi rabbil âlemin."}]}];
let done=JSON.parse(localStorage.getItem("hatmeDone")||"[]"), currentL=0,currentP=0,hide=false;
function save(){localStorage.setItem("hatmeDone",JSON.stringify(done));localStorage.setItem("hatmeLast",JSON.stringify([currentL,currentP]));updateProgress();}
function updateProgress(){const n=done.length,p=Math.floor(n/30*100);document.getElementById("percent").textContent=p+"%";document.getElementById("bar").style.width=p+"%";document.getElementById("doneCount").textContent=n+" / 30 parça tamamlandı";document.getElementById("pPercent").textContent=p+"%";document.getElementById("pBar").style.width=p+"%";document.getElementById("pCount").textContent=n+" / 30 ezber parçası tamamlandı";}
function view(id){["home","lessonList","reader","progressView"].forEach(x=>document.getElementById(x).style.display=x===id?"block":"none");}
function goHome(){view("home");updateProgress();}
function showLessons(){view("lessonList");const root=document.getElementById("lessons");root.innerHTML="";lessons.forEach((l,i)=>{const b=document.createElement("button");b.className="lesson";b.innerHTML=(i+1)+". "+l.title+"<small>"+l.parts.filter(p=>done.includes(p.number)).length+" / "+l.parts.length+" parça tamamlandı</small>";b.onclick=()=>{currentL=i;currentP=0;openPart();};root.appendChild(b);l.parts.forEach((p,j)=>{const row=document.createElement("div");row.className="part";const txt=document.createElement("span");txt.style.flex="1";txt.textContent=(done.includes(p.number)?"✓ ":"○ ")+"Parça "+p.number;const btn=document.createElement("button");btn.textContent="Aç ›";btn.onclick=()=>{currentL=i;currentP=j;openPart();};row.append(txt,btn);root.appendChild(row);});});}
function openPart(){view("reader");hide=false;renderPart();}
function renderPart(){const l=lessons[currentL],p=l.parts[currentP];document.getElementById("lessonTitle").textContent=l.title;document.getElementById("partTitle").textContent="EZBER PARÇASI "+p.number+(done.includes(p.number)?" ✓":"");document.getElementById("partText").textContent=hide?"••••••••••••••••••":p.text;}
function toggleText(){hide=!hide;renderPart();}
function markDone(){const p=lessons[currentL].parts[currentP].number;if(!done.includes(p))done.push(p);save();renderPart();}
function nextPart(){if(currentP<lessons[currentL].parts.length-1)currentP++;else if(currentL<lessons.length-1){currentL++;currentP=0;}save();renderPart();}
function previousPart(){if(currentP>0)currentP--;else if(currentL>0){currentL--;currentP=lessons[currentL].parts.length-1;}save();renderPart();}
function continueStudy(){const last=JSON.parse(localStorage.getItem("hatmeLast")||"[0,0]");currentL=Math.min(last[0],lessons.length-1);currentP=Math.min(last[1],lessons[currentL].parts.length-1);openPart();}
function showProgress(){view("progressView");updateProgress();const r=document.getElementById("pLessons");r.innerHTML="";lessons.forEach((l,i)=>{const c=l.parts.filter(p=>done.includes(p.number)).length;const div=document.createElement("div");div.className="card";div.innerHTML="<b>"+(i+1)+". "+l.title+"</b><p>"+c+" / "+l.parts.length+" tamamlandı</p><div class='progress'><div class='bar' style='width:"+(c/l.parts.length*100)+"%'></div></div>";r.appendChild(div);});}
updateProgress();
</script></body></html>
